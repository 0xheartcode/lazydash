name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Lint (staticcheck) must build and run under a Go that is at least as
          # new as the code it analyzes, so pin to a recent toolchain rather than
          # the module's minimum (go.mod go directive).
          go-version: "1.27"
          cache: true

      - name: Install tools
        run: make tools

      - name: Gate (fmt, vet, staticcheck, build, tests, coverage floor)
        run: make check
